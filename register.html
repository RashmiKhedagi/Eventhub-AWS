{% extends "base.html" %}
{% block title %}Sign up - EventHub{% endblock %}
{% block body %}
<div class="narrow">
  <h1 class="center">Create your account</h1>
  {% for e in errors %}<div class="alert">{{ e }}</div>{% endfor %}
  <form method="post" class="card stack">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Name <input name="name" value="{{ form.get('name', '') }}" required></label>
    <label>Email <input type="email" name="email" value="{{ form.get('email', '') }}" required></label>
    <label>Password (min 8 characters) <input type="password" name="password" minlength="8" required></label>
    <label>Confirm password <input type="password" name="confirm" minlength="8" required></label>
    <button class="btn primary" type="submit">Sign up</button>
  </form>
  <p class="muted center">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
