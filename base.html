<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EventHub{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('views.index') }}">Event<span>Hub</span></a>
  <nav class="nav">
    <a href="{{ url_for('views.index') }}">Browse</a>
    {% if current_user.is_authenticated %}
      <a href="{{ url_for('views.my_tickets') }}">My tickets</a>
      <a href="{{ url_for('views.my_events') }}">My events</a>
      <a class="btn primary small" href="{{ url_for('views.new_event') }}">+ New event</a>
      <form method="post" action="{{ url_for('auth.logout') }}">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        <button class="btn small" type="submit">Log out ({{ current_user.name.split()[0] }})</button>
      </form>
    {% else %}
      <a href="{{ url_for('auth.login') }}">Log in</a>
      <a class="btn primary small" href="{{ url_for('auth.register') }}">Sign up</a>
    {% endif %}
  </nav>
</header>
<main class="container">
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
  {% block body %}{% endblock %}
</main>
<footer class="footer muted">EventHub &middot; built with Python &amp; Flask</footer>
</body>
</html>
